# Render Blueprint: one free web service built from the Dockerfile.
# The database is Neon (Postgres + pgvector), not a Render database.
# Secrets use sync: false, so Render asks for their values in the dashboard
# and they never live in this file.
services:
  - type: web
    name: jo-tax-law-rag
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: checksPass  # deploy a commit only after its GitHub checks (CI) pass
    envVars:
      - key: DATABASE_URL          # Neon pooled URL of the SELECT-only rag_reader role (tools/create_reader_role.py)
        sync: false
      - key: RUN_MIGRATIONS        # the web service never migrates; python -m app.ingest does, as the owner
        value: "false"
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: DB_CONNECT_TIMEOUT_SECONDS   # Neon wakes a suspended compute in a few seconds
        value: "10"
      - key: GEMINI_EMBED_MODEL
        value: gemini-embedding-001
      - key: OPENROUTER_MODEL
        value: nvidia/nemotron-3-ultra-550b-a55b:free
      - key: OPENROUTER_FALLBACK_MODELS
        value: cohere/north-mini-code:free,google/gemma-4-31b-it:free
      - key: MIN_SIMILARITY        # calibrate with python -m app.eval, then update
        value: "0.60"
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: CLIENT_IP_HEADER      # Render's edge is Cloudflare, which overwrites this header with the client IP
        value: cf-connecting-ip
      - key: TRUSTED_PROXY_HOPS    # 0: if CLIENT_IP_HEADER is missing, key on the socket peer, never on an X-Forwarded-For entry
        value: "0"
      - key: HEALTH_TOKEN          # /health/db answers only with header X-Health-Token = this; unset = always 404
        sync: false
      # Abuse and cost guards (README "Security"). Daily counters reset at 00:00 UTC.
      - key: DAILY_ASK_LIMIT_PER_CLIENT
        value: "30"
      - key: DAILY_LLM_CALLS_PER_CLIENT  # so one client cannot use up DAILY_LLM_BUDGET alone
        value: "5"
      - key: DAILY_EMBEDDING_BUDGET  # below the Gemini free tier (gemini-embedding-001: reportedly ~1,000 a day)
        value: "800"
      - key: DAILY_LLM_BUDGET        # below OpenRouter's free-model cap (~50 a day without purchased credits)
        value: "45"
      - key: MAX_CONCURRENT_ASKS
        value: "4"
      - key: ANSWER_CACHE_SIZE
        value: "500"
      - key: ANSWER_CACHE_TTL_SECONDS
        value: "86400"
      - key: CORS_ALLOW_ORIGINS    # empty: the UI is served from the same origin
        value: ""
