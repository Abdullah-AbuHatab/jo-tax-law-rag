# Local stack: the API + Postgres with pgvector.
#
#   docker compose up --build                          # real providers: needs .env with keys
#   EMBEDDER=fake LLM=fake docker compose up --build   # offline demo against the same database
#
# Ingest (once, and again whenever data/clean changes):
#   docker compose run --rm api python -m app.ingest

services:
  db:
    # pgvector/pgvector:pg16, pinned by digest (multi-arch index, resolved 2026-10-25)
    image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag-local-only   # local container only; Neon credentials never go here
      POSTGRES_DB: rag
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://rag:rag-local-only@db:5432/rag
      # Local only: the container connects as the local owner role, so it may create the
      # schema on first use, as before. On Render the web service never migrates.
      RUN_MIGRATIONS: "true"
      EMBEDDER: ${EMBEDDER:-gemini}
      LLM: ${LLM:-openrouter}
      PORT: "8000"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
