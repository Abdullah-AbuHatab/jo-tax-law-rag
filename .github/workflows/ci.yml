name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # pgvector/pgvector:pg16, pinned by digest (multi-arch index, resolved 2026-10-25)
        image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # CI-only throwaway database; the integration tests drop and recreate their table.
      TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/postgres
    steps:
      # Actions are pinned to full commit SHAs (a tag can be moved); Dependabot bumps them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt
      - name: Install (runtime from the hashed lock, the image's exact set; then dev tools)
        run: |
          pip install --require-hashes --no-deps -r requirements.lock
          pip install -r requirements-dev.txt
      - name: Lock file matches requirements.txt
        # pip-compile keeps the pins already in requirements.lock and only changes what
        # requirements.txt forces, so any diff means the lock was not regenerated.
        run: |
          pip install pip-tools==7.6.2
          pip-compile --quiet --strip-extras --generate-hashes --output-file=requirements.lock requirements.txt
          git diff --exit-code requirements.lock
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Audit the locked runtime dependencies for known vulnerabilities
        run: pip-audit -r requirements.lock --require-hashes --disable-pip
      - name: Tests (unit + pgvector integration)
        run: pytest -q
      - name: Offline evaluation smoke run
        run: python -m app.eval --fake --out /tmp/results-fake.md
