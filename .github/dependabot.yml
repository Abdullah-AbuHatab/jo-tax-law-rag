# Weekly update PRs for what this repository pins: Python packages (requirements*.txt,
# and tools/requirements.txt for the data-preparation tools), the Docker base image
# digest, and the GitHub Actions commit SHAs in .github/workflows.
# cooldown: a release must be 7 days old before Dependabot proposes it, so a
# compromised release that is yanked within days never reaches a PR.
# requirements.lock is not updated by Dependabot: after a requirements.txt bump, CI's
# lock check fails until the lock is regenerated (see README "Dependencies").
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: "/tools"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
